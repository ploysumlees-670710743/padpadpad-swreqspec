name: Verify UC-01 and UC-07 prototype
on:
  push:
    branches:
      - 'feature/751-uc01-uc07'
      - 'feature/751-uc01-uc07-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-feature-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Execute only UC-01 and UC-07 tests
        run: python -m pytest -v --junitxml=backend-results.xml backend/tests/test_AC_01.py backend/tests/test_AC_07.py

  frontend-prototype-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install packages
        run: npm ci
      - name: Run UC-01/UC-07 offline prototype contract tests
        run: node --test src/__tests__/uc01_uc07_prototype.test.js
      - name: Run UC-01/UC-07 component tests
        run: npx vitest run src/__tests__/uc01_uc07_ui.test.jsx
      - name: Full frontend regression audit (non-gating)
        id: full_frontend
        continue-on-error: true
        run: npm test -- --reporter=json --outputFile=frontend-results.json
      - name: Summarize frontend audit
        if: always()
        run: node -e "const r=JSON.parse(require('fs').readFileSync('frontend-results.json')); console.log('::notice title=Frontend audit::passed='+r.numPassedTests+' failed='+r.numFailedTests+' total='+r.numTotalTests)"
      - name: Build React/Vite frontend
        run: npm run build

  # Diagnostic only: report compatibility with other features without changing
  # classmates' code or claiming the entire integrated system is ready.
  backend-repository-audit:
    name: Full backend regression audit (non-gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run entire backend test suite (diagnostic)
        id: full_backend
        continue-on-error: true
        run: python -m pytest -v --junitxml=backend-results.xml backend/tests
      - name: Summarize backend counts
        if: always()
        run: python -c "import xml.etree.ElementTree as E; s=E.parse('backend-results.xml').getroot().find('testsuite'); print('::notice title=Backend audit::'+str(s.attrib))"
      - name: Summarize diagnostic
        if: always()
        run: |
          echo "Whole backend test suite outcome: ${{ steps.full_backend.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This diagnostic is non-gating and does not replace feature-specific verification." >> "$GITHUB_STEP_SUMMARY"
